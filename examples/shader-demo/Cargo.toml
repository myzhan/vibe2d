[package]
name = "shader-demo"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["vdp"]
# vdp lets the demo be driven/inspected over the Vibe Debug Protocol and
# supports `vibe screenshot`. It does not implement custom game-level VDP
# methods — the default `Game` trait impls are enough for engine debugging.
vdp = ["vibe2d/vdp", "dep:serde_json", "dep:serde"]

[dependencies]
vibe2d = { workspace = true }
glam.workspace = true
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# VDP end-to-end integration test (see tests/vdp_shader.rs).
vibe_test = { workspace = true, features = ["vdp"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
anyhow.workspace = true
serde_json.workspace = true
image.workspace = true
