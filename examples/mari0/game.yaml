    light_bridge: "assets/mari0/lightbridge.png"
    light_bridge_side: "assets/mari0/lightbridgeside.png"
    button_base: "assets/mari0/buttonbase.png"
    button_cap: "assets/mari0/buttonbutton.png"
    push_button: "assets/mari0/pushbutton.png"
    door_piece: "assets/mari0/doorpiece.png"
    door_centre: "assets/mari0/doorcenter.png"
    wall_indicator: "assets/mari0/wallindicator.png"
    wall_timer: "assets/mari0/walltimer.png"
    cube: "assets/mari0/box.png"
    cube_dispenser: "assets/mari0/cubedispenser.png"
    gel_dispenser: "assets/mari0/geldispenser.png"
