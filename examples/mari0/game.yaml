input:
  gamepad:
    deadzone: 0.15
    # Movement is bound to the left stick, so the threshold stays at the default
    # 0.5 — unlike Tetris, nothing here is destructive enough to need a guard.
    axis_threshold: 0.5

  actions:
    move_left:
      keys: ["Left", "A"]
      gamepad_buttons: ["DPadLeft"]
      gamepad_axes: ["LeftStickLeft"]
    move_right:
      keys: ["Right", "D"]
      gamepad_buttons: ["DPadRight"]
      gamepad_axes: ["LeftStickRight"]
    jump:
      keys: ["Space", "W"]
      gamepad_buttons: ["South"]
    crouch:
      keys: ["Down", "S"]
      gamepad_buttons: ["DPadDown"]
      gamepad_axes: ["LeftStickDown"]
    # Climbing a vine. Its own action rather than a reuse of `jump`, because up and
    # down have to be independent of the jump button while hanging on one — and `use`
    # already has Up, which is harmless: there is nothing to use on a vine.
    climb_up:
      keys: ["Up", "W"]
      gamepad_buttons: ["DPadUp"]
      gamepad_axes: ["LeftStickUp"]
    # The portal gun goes on the triggers: they're analogue, so they read as the
    # two "weapons" a Portal player expects, and they leave the face buttons free.
    portal_blue:
      keys: []
      mouse_buttons: ["Left"]
      gamepad_buttons: ["LeftTrigger"]
    portal_orange:
      keys: []
      mouse_buttons: ["Right"]
      gamepad_buttons: ["RightTrigger"]
    fire:
      keys: ["F", "ShiftLeft"]
      gamepad_buttons: ["West", "RightShoulder"]
    # Freeze the game. The original opens a menu here; this is just the freeze.
    pause:
      keys: ["P", "Escape"]
      gamepad_buttons: ["Start"]
    # Wall buttons in the lab are pressed with a "use" key, not walked into
    # (`pushbutton:used`), so they need a binding of their own.
    use:
      keys: ["E", "Up"]
      gamepad_buttons: ["North"]
    # Cycle hats on the title screen. The original picks these in a skin editor; here
    # it is one key, so it needs a binding no other menu key has already claimed.
    hat:
      keys: ["H"]
      gamepad_buttons: ["East"]

