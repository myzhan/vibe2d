  fonts:
    ui: "assets/fonts/game.ttf:16"
    title: "assets/fonts/game.ttf:24"
    score: "assets/fonts/game.ttf:12"
    hud: "assets/fonts/game.ttf:10"
  audio:
    jump: "assets/sounds/jump.ogg"
    jumpbig: "assets/sounds/jumpbig.ogg"
    stomp: "assets/sounds/stomp.ogg"
    bulletbill: "assets/sounds/bulletbill.ogg"
    coin: "assets/sounds/coin.ogg"
    blockhit: "assets/sounds/blockhit.ogg"
    blockbreak: "assets/sounds/blockbreak.ogg"
    mushroomappear: "assets/sounds/mushroomappear.ogg"
    mushroomeat: "assets/sounds/mushroomeat.ogg"
    shrink: "assets/sounds/shrink.ogg"
    death: "assets/sounds/death.ogg"
    fireball: "assets/sounds/fireball.ogg"
    oneup: "assets/sounds/oneup.ogg"
    portal1open: "assets/sounds/portal1open.ogg"
    portal2open: "assets/sounds/portal2open.ogg"
    portalenter: "assets/sounds/portalenter.ogg"
    gameover: "assets/sounds/gameover.ogg"
    levelend: "assets/sounds/levelend.ogg"
    scorering: "assets/sounds/scorering.ogg"
    shot: "assets/sounds/shot.ogg"

    # Level music. Each theme has a `-fast` twin, played from zero once the clock
    # drops below 99 — see `src/music.rs`. `starmusic` doubles as the bonus-stage
    # theme (`music = 6`).
    overworld: "assets/sounds/overworld.ogg"
    overworld-fast: "assets/sounds/overworld-fast.ogg"
    underground: "assets/sounds/underground.ogg"
    underground-fast: "assets/sounds/underground-fast.ogg"
    castle: "assets/sounds/castle.ogg"
    castle-fast: "assets/sounds/castle-fast.ogg"
    underwater: "assets/sounds/underwater.ogg"
    underwater-fast: "assets/sounds/underwater-fast.ogg"
    starmusic: "assets/sounds/starmusic.ogg"
    starmusic-fast: "assets/sounds/starmusic-fast.ogg"
    # Warning beep at 99. Not music: it plays over silence, because crossing 99
    # stops every other source.
    lowtime: "assets/sounds/lowtime.ogg"

input:
  gamepad:
    deadzone: 0.15
    # Movement is bound to the left stick, so the threshold stays at the default
    # 0.5 — unlike Tetris, nothing here is destructive enough to need a guard.
    axis_threshold: 0.5

  actions:
    move_left:
      keys: ["Left", "A"]
      gamepad_buttons: ["DPadLeft"]
      gamepad_axes: ["LeftStickLeft"]
    move_right:
      keys: ["Right", "D"]
      gamepad_buttons: ["DPadRight"]
      gamepad_axes: ["LeftStickRight"]
    jump:
      keys: ["Space", "W"]
      gamepad_buttons: ["South"]
    crouch:
      keys: ["Down", "S"]
      gamepad_buttons: ["DPadDown"]
      gamepad_axes: ["LeftStickDown"]
    # The portal gun goes on the triggers: they're analogue, so they read as the
    # two "weapons" a Portal player expects, and they leave the face buttons free.
    portal_blue:
      keys: []
      mouse_buttons: ["Left"]
      gamepad_buttons: ["LeftTrigger"]
    portal_orange:
      keys: []
      mouse_buttons: ["Right"]
      gamepad_buttons: ["RightTrigger"]
    fire:
      keys: ["F", "ShiftLeft"]
      gamepad_buttons: ["West", "RightShoulder"]
    # Wall buttons in the lab are pressed with a "use" key, not walked into
    # (`pushbutton:used`), so they need a binding of their own.
    use:
      keys: ["E", "Up"]
      gamepad_buttons: ["North"]

debug:
  vdp:
    enabled: true
    port: 9229
