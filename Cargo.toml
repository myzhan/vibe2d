[workspace]
resolver = "2"
members = [
    "crates/vibe2d",
    "crates/vibe_render",
    "crates/vibe_physics",
    "crates/vibe_aoi",
    "crates/vibe_audio",
    "crates/vibe_input",
    "crates/vibe_asset",
    "crates/vibe_debug",
    "crates/vibe_vdp_macros",
    "crates/vibe_platform",
    "crates/vibe_ui",
    "crates/vibe_test",
    "tools/vibe-cli",
    "examples/flappy-bird",
    "examples/tetris",
    "examples/mari0",
    "examples/ui",
    "examples/aoi-demo",
    "examples/gamepad",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
vibe2d = { path = "crates/vibe2d", default-features = false }
vibe_render = { path = "crates/vibe_render" }
vibe_physics = { path = "crates/vibe_physics" }
vibe_aoi = { path = "crates/vibe_aoi" }
vibe_audio = { path = "crates/vibe_audio" }
vibe_input = { path = "crates/vibe_input" }
vibe_asset = { path = "crates/vibe_asset" }
vibe_debug = { path = "crates/vibe_debug" }
vibe_vdp_macros = { path = "crates/vibe_vdp_macros" }
vibe_platform = { path = "crates/vibe_platform" }
vibe_ui = { path = "crates/vibe_ui" }
vibe_test = { path = "crates/vibe_test" }

# External dependencies
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
winit = "0.30"
# Gamepad input. Default features keep the modern `wgi` Windows backend, which
# only pulls the `windows` crate on Windows targets.
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.26"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
# Profiling (Tracy) — native-only, gated behind the `profiling` feature.
# `ondemand` lets the profiler connect/disconnect/reconnect at will (without it
# the client only serves a single session). `demangle` renders readable Rust
# symbol names in zones and call stacks.
tracy-client = { version = "0.18", features = ["ondemand", "demangle"] }
tracing-tracy = "0.11"
anyhow = "1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.9"
fontdue = "0.9"
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }

# Encoding
base64 = "0.22"

# Web/WASM dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
web-time = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
