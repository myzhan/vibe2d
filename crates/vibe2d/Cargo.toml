[package]
name = "vibe2d"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI-friendly 2D game engine"

[features]
default = ["vdp"]
vdp = ["dep:vibe_debug", "dep:serde_json", "dep:vibe_vdp_macros"]
# Tracy profiler integration (default off, native-only). Adds a TracyLayer to
# the desktop tracing subscriber and cascades frame/zone marks into the loop.
profiling = [
    "dep:tracing-tracy",
    "dep:tracy-client",
    "vibe_platform/profiling",
    "vibe_render/profiling",
]
# Capture a Rust call stack for every zone (macOS-friendly alternative to
# Tracy's sampling, which has no backend on macOS). Non-trivial per-frame
# overhead — enable only when you need the stacks.
profiling-callstacks = [
    "profiling",
    "vibe_platform/profiling-callstacks",
    "vibe_render/profiling-callstacks",
]

[dependencies]
vibe_render = { workspace = true }
vibe_input = { workspace = true }
vibe_audio = { workspace = true }
vibe_asset = { workspace = true }
vibe_ui = { workspace = true }
vibe_platform = { workspace = true }
vibe_debug = { workspace = true, optional = true }
vibe_vdp_macros = { workspace = true, optional = true }
glam.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json = { workspace = true, optional = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-tracy = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
web-time.workspace = true
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "ErrorEvent", "BinaryType", "Location"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
base64.workspace = true
